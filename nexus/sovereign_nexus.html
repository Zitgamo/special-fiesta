<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN NEXUS v7.0 // ELITE TACTICAL HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --neon-green: #00ff88;
            --neon-red: #ff004c;
            --neon-gold: #ffcc00;
            --bg: #02040a;
            --glass: rgba(10, 15, 30, 0.7);
            --glass-bright: rgba(0, 242, 255, 0.05);
            --border: rgba(0, 242, 255, 0.2);
            --panel-bg: rgba(5, 8, 15, 0.9);
        }

        * { 
            box-sizing: border-box; 
            scrollbar-width: thin;
            scrollbar-color: var(--neon-blue) transparent;
        }

        @keyframes pulse-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            background: var(--bg);
            color: #e0e6ed;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(188, 19, 254, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 242, 255, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
        }

        header {
            height: 90px;
            padding: 0 50px;
            background: rgba(1, 2, 5, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 1000;
            position: relative;
        }

        header::after {
            content: "";
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            opacity: 0.5;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 15px;
            color: var(--neon-blue);
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.6);
            position: relative;
        }

        .title span.tag-status {
            font-size: 10px;
            letter-spacing: 2px;
            background: var(--neon-green);
            color: #000;
            padding: 2px 10px;
            border-radius: 2px;
            position: absolute;
            top: -15px;
            right: -20px;
            box-shadow: 0 0 10px var(--neon-green);
        }

        .pnl-container {
            display: flex;
            gap: 30px;
        }

        .pnl-box {
            background: rgba(255,255,255,0.02);
            padding: 12px 30px;
            border-radius: 4px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .pnl-box::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--neon-blue);
        }

        .pnl-box:hover {
            background: rgba(0, 242, 255, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
        }

        .pnl-box label {
            font-size: 10px;
            opacity: 0.5;
            display: block;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .pnl-box span { 
            font-family: 'Orbitron';
            font-size: 24px; 
            font-weight: 900; 
        }

        main {
            display: grid;
            grid-template-columns: 420px 1fr 450px;
            gap: 25px;
            padding: 25px;
            flex-grow: 1;
            height: calc(100vh - 90px);
            min-height: 0;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 25px;
            height: 100%;
            min-height: 0;
        }

        /* --- CARDS & PANELS --- */
        .panel {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: border-color 0.3s;
        }

        .panel:hover {
            border-color: rgba(0, 242, 255, 0.4);
        }

        .panel-header {
            padding: 15px 25px;
            background: rgba(0, 242, 255, 0.05);
            border-bottom: 1px solid var(--border);
            font-family: 'Orbitron';
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--neon-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        /* --- TACTICAL UNITS --- */
        .unit-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-left: 5px solid var(--unit-color);
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .unit-card:hover {
            background: rgba(255,255,255,0.04);
            transform: translateX(5px);
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        .unit-name {
            font-family: 'Orbitron';
            font-size: 20px;
            font-weight: 900;
            color: var(--unit-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .metric-item {
            text-align: center;
        }

        .metric-item label {
            font-size: 9px;
            opacity: 0.4;
            display: block;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .metric-item value {
            font-family: 'Orbitron';
            font-size: 18px;
            font-weight: 700;
        }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-blue); }

        /* --- ANIMATIONS --- */
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(0, 242, 255, 0.1);
            z-index: 10000;
            pointer-events: none;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(100vh); }
        }

        .pnl-pos { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
        .pnl-neg { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }

        #clock-local { font-family: 'Orbitron'; font-size: 36px; font-weight: 900; color: var(--neon-blue); }

        /* --- TABS --- */
        .tab-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-item {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            cursor: pointer;
            font-family: 'Orbitron';
            font-size: 12px;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .tab-item.active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        .radar-box {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px dashed var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <header>
        <div class="title">SOVEREIGN NEXUS <span class="tag-status">HARDENED</span></div>
        <div class="pnl-container">
            <div class="pnl-box">
                <label>GLOBAL P&L (USD)</label>
                <span id="usd-pnl" class="pnl-pos">$0.00</span>
            </div>
            <div class="pnl-box" style="border-left-color: var(--neon-purple)">
                <label>AO LÀNG (VND)</label>
                <span id="vnd-pnl" class="pnl-pos">0đ</span>
            </div>
        </div>
        <div style="text-align: right">
            <div id="clock-local">00:00:00</div>
            <div style="font-size: 10px; opacity: 0.4; letter-spacing: 3px; font-weight: 700;">SYSTEM TIME // ICT SYNCED</div>
        </div>
    </header>

    <main>
        <!-- LEFT: TACTICAL ASSETS -->
        <div class="column">
            <div class="panel">
                <div class="panel-header">NEURAL RADAR // SCAN</div>
                <div class="panel-body" style="padding: 10px;">
                    <div class="tab-group">
                        <div class="tab-item active" onclick="flipPage('radar')">SCANNER</div>
                        <div class="tab-item" onclick="flipPage('pools')">POOLS</div>
                    </div>
                    <div id="page-radar" class="radar-box active" style="display: flex;">
                        <div id="scan-list-mini" class="scroll-area" style="padding: 15px;">
                            <!-- Active Scan Items -->
                        </div>
                    </div>
                    <div id="page-pools" class="radar-box" style="display: none; padding: 20px;">
                        <div class="metric-item" style="margin-bottom: 25px;">
                            <label>EXNESS EQUITY</label>
                            <value id="equity-mt5" style="color: var(--neon-blue); font-size: 32px;">$0.00</value>
                        </div>
                        <div class="metric-item" style="margin-bottom: 25px;">
                            <label>BINANCE EQUITY</label>
                            <value id="equity-bnc" style="color: var(--neon-gold); font-size: 32px;">$0.00</value>
                        </div>
                        <div class="metric-item">
                            <label>VN30 EQUITY</label>
                            <value id="equity-south" style="color: var(--neon-purple); font-size: 28px;">0 đ</value>
                        </div>
                    </div>
                </div>
            </div>
            <a href="southern_command.html" target="_blank" style="text-decoration:none; padding:15px; background:rgba(188,19,254,0.1); border:1px solid var(--neon-purple); color:var(--neon-purple); text-align:center; font-family:'Orbitron'; font-size:12px; font-weight:900; letter-spacing:3px; border-radius:4px;">ACCESS SOUTHERN COMMAND ></a>
        </div>

        <!-- CENTER: FLEET DEPLOYMENT -->
        <div class="column">
            <div class="panel" style="flex: 1;">
                <div class="panel-header">SOVEREIGN FLEET // DEPLOYMENT</div>
                <div id="squadron-list" class="panel-body">
                    <!-- Unit Cards Injected Here -->
                </div>
            </div>
        </div>

        <!-- RIGHT: ENGAGEMENT LOGS -->
        <div class="column">
            <div class="panel" style="flex: 1.5;">
                <div class="panel-header">LIVE ENGAGEMENT TRACKER</div>
                <div id="trade-log" class="panel-body" style="padding: 0;">
                    <!-- Engagement data -->
                </div>
            </div>
            <div class="panel" style="height: 250px;">
                <div class="panel-header">TACTICAL EVENT FEED</div>
                <div id="intel-list" class="panel-body" style="font-size: 11px; color: var(--neon-blue); opacity: 0.8;">
                    <!-- Learning events -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const formatVND = (num) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num).replace('₫', 'đ');

        window.toggleRadar = function(show) {
            const modal = document.getElementById('radar-modal');
            modal.style.display = show ? 'block' : 'none';
        };

        window.flipPage = function(target) {
            const p1 = document.getElementById('page-pools');
            const p2 = document.getElementById('page-radar');
            const t1 = document.getElementById('tab-pools');
            const t2 = document.getElementById('tab-radar');
            
            if (target === 'radar') {
                p1.classList.remove('active');
                p2.classList.add('active');
                t1.classList.remove('active');
                t2.classList.add('active');
            } else {
                p2.classList.remove('active');
                p1.classList.add('active');
                t2.classList.remove('active');
                t1.classList.add('active');
            }
        };

        const SCAN_ASSETS = ["BTC", "ETH", "SOL", "XAU", "XAG", "NAS100", "US30", "EURUSD", "GBPUSD", "USDJPY", "AUDUSD", "DE30", "OIL", "GAS", "ADA", "DOT", "XRP", "LTC", "LINK", "AVAX", "XLM", "BNB", "MATIC", "FTM", "ATOM", "ALGO", "NEAR", "VET", "TRX", "HBAR"];
        
        function updateNeuralScan() {
            const fullList = document.getElementById('scan-list-full');
            const miniList = document.getElementById('scan-list-mini');
            
            // 1. Generate data for all assets
            const scanData = SCAN_ASSETS.map(asset => {
                return {
                    symbol: asset,
                    er: (0.3 + Math.random() * 1.7).toFixed(2),
                    id: Math.floor(Math.random() * 9999)
                };
            });

            // 2. SORT BY ER DESCENDING
            scanData.sort((a, b) => b.er - a.er);

            if (fullList) {
                const items = scanData.map((data, index) => {
                    const color = data.er > 1.2 ? 'var(--neon-green)' : 'var(--neon-blue)';
                    const status = data.er > 1.2 ? "READY" : "WATCH";
                    // Special glow for top 4 (Highest ER)
                    const glow = index < 4 ? `box-shadow: 0 0 20px ${color}33; border: 1px solid ${color};` : '';
                    
                    return `
                        <div style="background:rgba(255,255,255,0.02); padding:20px; border-left: 4px solid ${color}; ${glow}">
                            <div style="font-size:10px; opacity:0.4">T-RANK: ${index + 1} // ID:${data.id}</div>
                            <div style="font-size:28px; font-weight:900; font-family:Orbitron">${data.symbol}</div>
                            <div style="display:flex; justify-content:space-between; margin-top:10px;">
                                <span style="color:${color}; font-weight:900">ER: ${data.er}</span>
                                <span style="opacity:0.6; font-size:11px">${status}</span>
                            </div>
                        </div>
                    `;
                });
                fullList.innerHTML = items.join('');
            }

            if (miniList) {
                // Show top 10 on the mini-view
                const items = scanData.slice(0, 10).map(data => {
                    return `<div style="margin-bottom:6px; color:${data.er > 1.2 ? 'var(--neon-green)' : 'var(--neon-blue)'}">> ${data.symbol} [ER:${data.er}]</div>`;
                });
                miniList.innerHTML = items.join('');
            }
        }
        setInterval(updateNeuralScan, 4000);

        async function updateHUD() {
            try {
                const response = await fetch('http://127.0.0.1:5050/api/telemetry');
                const data = await response.json();

                if (data.status === "ONLINE") {
                    document.getElementById('clock-local').innerText = data.current_time_utc;
                    
                    document.getElementById('usd-pnl').innerText = `$${(data.session_pnl_usd || 0).toFixed(2)}`;
                    document.getElementById('usd-pnl').className = data.session_pnl_usd >= 0 ? 'pnl-pos' : 'pnl-neg';
                    
                    document.getElementById('vnd-pnl').innerText = formatVND(data.session_pnl_vnd || 0);
                    document.getElementById('vnd-pnl').className = data.session_pnl_vnd >= 0 ? 'pnl-pos' : 'pnl-neg';

                    document.getElementById('equity-mt5').innerText = `$${(data.health_mt5.equity || 0).toFixed(2)}`;
                    document.getElementById('drawdown-mt5').innerText = `${((data.health_mt5.drawdown || 0)*100).toFixed(2)}%`;

                    const bnc = data.health_bnc || {};
                    document.getElementById('equity-bnc').innerText = `$${(bnc.equity || 0).toFixed(2)}`;
                    document.getElementById('drawdown-bnc').innerText = `${((bnc.drawdown || 0)*100).toFixed(2)}%`;

                    document.getElementById('equity-south').innerText = formatVND(data.health_south.equity_vnd || 0);
                    document.getElementById('drawdown-south').innerText = `${((data.health_south.drawdown || 0)*100).toFixed(2)}%`;

                    const squadDiv = document.getElementById('squadron-list');
                    if (!squadDiv) return;
                    squadDiv.innerHTML = '';
                    
                    window.toggleLogic = function(unit) {
                        const overlay = document.getElementById(`logic-${unit}`);
                        if (overlay.style.display === 'block') {
                            overlay.style.display = 'none';
                        } else {
                            document.querySelectorAll('.logic-overlay').forEach(o => o.style.display = 'none');
                            overlay.style.display = 'block';
                        }
                    };
                    
                    // Clear the old DNA list if it exists (we are merging into squad-list)
                    const dnaDiv = document.getElementById('dna-list');
                    if (dnaDiv) dnaDiv.innerHTML = '';

                    const unitStyles = {
                        "ALPHA": { 
                            name: "GUARDIAN", icon: "🛡️", 
                            desc: "Trend-Follower. High-conviction strikes.",
                            diagram: "[PRICE] ───( ATR-CHANNEL )─── [ENTRY]\n          ▲                 ▼\n      ( VOL-CONF ) ──── ( TREND-LOCK )"
                        },
                        "OMEGA": { 
                            name: "HARVESTER", icon: "⚔️", 
                            desc: "Momentum Dominator. Aggressive ATR layering.",
                            diagram: "[MOMENTUM] ──► [SCALE-IN] ──► [SCALE-MAX]\n     │            │             │\n     └─ ATR-ADJ ──┴─ RISK-PAR ──┘"
                        },
                        "GAMMA": { 
                            name: "SCALPER", icon: "⚡", 
                            desc: "Rapid Scalper. Mean-Reversion.",
                            diagram: "[DEV] ── ( REVERSION ) ── [TARGET]\n  │            │            │\n  └─ BB-OUT ───┴─ RSI-DIV ──┘"
                        }
                    };

                    window.toggleLogic = function(unit) {
                        const modal = document.getElementById('logic-modal');
                        if (!unit) { modal.style.display = 'none'; return; }
                        
                        const meta = unitStyles[unit];
                        const color = unit==='ALPHA'?'var(--neon-blue)':unit==='OMEGA'?'var(--neon-gold)':'var(--neon-purple)';
                        
                        document.getElementById('logic-modal-title').innerText = `${unit} // TACTICAL PROTOCOL`;
                        document.getElementById('logic-modal-title').style.color = color;
                        modal.style.borderColor = color;
                        
                        document.getElementById('logic-modal-body').innerHTML = `
                            <div style="font-size:24px; margin-bottom:30px; opacity:0.8">${meta.desc}</div>
                            <div class="logic-diagram" style="--unit-color:${color}; font-size:20px; line-height:1.5; padding:40px;">${meta.diagram}</div>
                            <div style="margin-top:40px; display:grid; grid-template-columns:1fr 1fr; gap:30px;">
                                <div style="background:rgba(255,255,255,0.05); padding:20px; border-left:4px solid var(--neon-gold)">
                                    <div style="font-size:12px; opacity:0.5">REINFORCEMENT</div>
                                    <div style="font-size:20px; font-weight:900">${unit==='OMEGA'?'ATR-DRIVEN SCALE ENABLED':'RESTRICTED'}</div>
                                </div>
                                <div style="background:rgba(255,255,255,0.05); padding:20px; border-left:4px solid var(--neon-green)">
                                    <div style="font-size:12px; opacity:0.5">PROFIT PROTECTION</div>
                                    <div style="font-size:20px; font-weight:900">SHAVE-PROFIT ACTIVE</div>
                                </div>
                            </div>
                        `;
                        modal.style.display = 'block';
                    };

                    for (const [unit, symbols] of Object.entries(data.squadron)) {
                        const color = unit==='ALPHA'?'var(--neon-blue)':unit==='OMEGA'?'var(--neon-gold)':'var(--neon-purple)';
                        const dna = data.dna[unit] || {};
                        const stats = data.unit_stats[unit] || { win_rate: "0%", strikes: 0, context: { er: 0, confidence: 0 } };
                        const meta = unitStyles[unit] || { name: "RECON", icon: "🛰️" };
                        const rr = Math.abs(dna.TP / (dna.SL || 0.1)).toFixed(1);
                        
                        squadDiv.innerHTML += `
                            <div class="unit-card" style="--unit-color: ${color}">
                                <div class="unit-header">
                                    <div class="unit-id">
                                        <span class="unit-icon">${meta.icon}</span>
                                        <span class="unit-name">${unit}</span>
                                        <span class="unit-tag">${meta.name}</span>
                                    </div>
                                    <div class="unit-rr">RR: ${rr}:1</div>
                                </div>
                                
                                <div class="unit-metrics">
                                    <div class="metric-box">
                                        <div class="metric-label">EFFICIENCY</div>
                                        <div class="metric-value">${stats.context.er.toFixed(2)}</div>
                                    </div>
                                    <div class="metric-box">
                                        <div class="metric-label">WIN RATE</div>
                                        <div class="metric-value" style="color:var(--neon-green)">${stats.win_rate}</div>
                                    </div>
                                    <div class="metric-box">
                                        <div class="metric-label">CONFIDENCE</div>
                                        <div class="metric-value">${stats.context.confidence}%</div>
                                    </div>
                                </div>

                                <div class="unit-deployment">
                                    <div class="deploy-label">DEPLOYED SQUADRON</div>
                                    <div class="symbol-grid">
                                        ${symbols.map(s => {
                                            const isBnc = s.includes('USDT');
                                            return `<span class="symbol-badge ${isBnc?'bnc':'mt5'}">${s.replace('USDT','')} <small>${isBnc?'BNC':'MT5'}</small></span>`;
                                        }).join('')}
                                    </div>
                                </div>

                                <div class="unit-footer">
                                    <div class="allocation">LOT: <span style="color:var(--neon-blue)">${dna.LOT_SIZE || 'AUTO'}</span></div>
                                    <div class="tactical-btn" onclick="toggleLogic('${unit}')">TACTICAL LOGIC</div>
                                </div>
                            </div>
                        `;
                    }

                    const tradeDiv = document.getElementById('trade-log');
                    const southDiv = document.getElementById('south-strikes');
                    
                    if (!tradeDiv || !southDiv) return;

                    const vnTrades = data.trades.filter(t => t.symbol === 'VN30F1M');
                    const otherTrades = data.trades.filter(t => t.symbol !== 'VN30F1M');

                    if (vnTrades.length > 0) {
                        southDiv.innerHTML = vnTrades.slice(0, 8).map(t => {
                            const pnlVal = t.pnl * 100000;
                            const pnlClass = pnlVal >= 0 ? 'pnl-pos' : 'pnl-neg';
                            const timeStr = t.time.includes(' ') ? t.time.split(' ')[1] : t.time;
                            return `
                                <div class="trade-row" style="grid-template-columns: 1fr 1fr; border-bottom: 1px solid rgba(188,19,254,0.1)">
                                    <div style="font-size:12px; font-family:Orbitron">${timeStr}</div>
                                    <div style="text-align:right; font-weight:700" class="${pnlClass}">${formatVND(pnlVal)}</div>
                                </div>
                            `;
                        }).join('');
                    } else {
                        southDiv.innerHTML = '<div style="text-align:center; padding:20px; opacity:0.3; font-size:11px">NO RECENT AO LÀNG STRIKES</div>';
                    }

                    tradeDiv.innerHTML = otherTrades.map(t => {
                        const pnlVal = t.pnl;
                        const pnlClass = pnlVal >= 0 ? 'pnl-pos' : 'pnl-neg';
                        const timeStr = t.time.includes(' ') ? t.time.split(' ')[1] : t.time;
                        return `
                            <div class="trade-row">
                                <div>
                                    <div style="font-weight:700">${t.symbol}</div>
                                    <div style="font-size:10px; opacity:0.5">${t.unit} // ${t.side}</div>
                                </div>
                                <div style="text-align:right">
                                    <div class="${pnlClass}" style="font-size:18px; font-weight:700">${pnlVal >= 0 ? '+' : ''}$${pnlVal.toFixed(2)}</div>
                                    <div style="font-size:10px; opacity:0.5; font-family:Orbitron">${timeStr}</div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (e) { console.error("HUD Render Error:", e); }
        }

        async function updateIntelligence() {
            try {
                const response = await fetch('http://127.0.0.1:5050/api/intelligence');
                const data = await response.json();
                const intelList = document.getElementById('intel-list');
                
                if (data.samples > 0 && data.top_configs && data.top_configs.length > 0) {
                    intelList.innerHTML = data.top_configs.slice(0, 3).map(c => {
                        const slVal = c.sl !== null ? c.sl : '---';
                        const tpVal = c.tp !== null ? c.tp : '---';
                        const pnlVal = (c.avg_pnl || 0).toFixed(2);
                        const pnlColor = (c.avg_pnl || 0) >= 0 ? 'var(--neon-green)' : '#ff4b4b';
                        
                        return `
                            <div style="display:flex; justify-content:space-between; margin-bottom:10px; background:rgba(255,255,255,0.02); padding:10px; border-left: 2px solid ${pnlColor}">
                                <span>${c.symbol} <span style="font-size:10px; opacity:0.6">(S:${slVal} T:${tpVal})</span></span>
                                <span style="color:${pnlColor}; font-weight:bold">${(c.avg_pnl || 0) >= 0 ? '+' : ''}${pnlVal}</span>
                            </div>
                        `;
                    }).join('');
                } else {
                    intelList.innerHTML = `<div style="text-align:center; padding:20px; opacity:0.3">NEURAL LEARNING IN PROGRESS... (${data.samples || 0} samples)</div>`;
                }
            } catch (e) {
                console.error("Intelligence Update Failed:", e);
            }
        }

        setInterval(updateHUD, 3000);
        setInterval(updateIntelligence, 10000);
        updateHUD();
        updateIntelligence();
    </script>
</body>
</html>
