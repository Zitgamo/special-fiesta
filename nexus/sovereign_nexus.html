<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN NEXUS v7.0 // ELITE TACTICAL HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --neon-green: #00ff88;
            --neon-red: #ff004c;
            --neon-gold: #ffcc00;
            --bg: #02040a;
            --glass: rgba(10, 15, 30, 0.7);
            --glass-bright: rgba(0, 242, 255, 0.05);
            --border: rgba(0, 242, 255, 0.2);
            --panel-bg: rgba(5, 8, 15, 0.9);
        }

        * { 
            box-sizing: border-box; 
            scrollbar-width: thin;
            scrollbar-color: var(--neon-blue) transparent;
        }

        @keyframes pulse-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            background: var(--bg);
            color: #e0e6ed;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(188, 19, 254, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 242, 255, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
        }

        header {
            height: 90px;
            padding: 0 50px;
            background: rgba(1, 2, 5, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 1000;
            position: relative;
        }

        header::after {
            content: "";
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            opacity: 0.5;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 15px;
            color: var(--neon-blue);
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.6);
            position: relative;
        }

        .title span.tag-status {
            font-size: 10px;
            letter-spacing: 2px;
            background: var(--neon-green);
            color: #000;
            padding: 2px 10px;
            border-radius: 2px;
            position: absolute;
            top: -15px;
            right: -20px;
            box-shadow: 0 0 10px var(--neon-green);
        }

        .pnl-container {
            display: flex;
            gap: 30px;
        }

        .pnl-box {
            background: rgba(255,255,255,0.02);
            padding: 12px 30px;
            border-radius: 4px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .pnl-box::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--neon-blue);
        }

        .pnl-box:hover {
            background: rgba(0, 242, 255, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
        }

        .pnl-box label {
            font-size: 10px;
            opacity: 0.5;
            display: block;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .pnl-box span { 
            font-family: 'Orbitron';
            font-size: 26px; 
            font-weight: 900; 
            white-space: nowrap;
        }

        .pnl-sub {
            font-size: 11px;
            opacity: 0.5;
            margin-top: 8px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 5px;
        }

        .ratio-bar-container {
            width: 150px;
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
            display: flex;
        }

        .ratio-fill { height: 100%; transition: width 0.5s; }
        .ratio-front { background: var(--neon-blue); }
        .ratio-back { background: var(--neon-purple); }

        main {
            display: grid;
            grid-template-columns: 420px 1fr 450px;
            gap: 25px;
            padding: 25px;
            flex-grow: 1;
            height: calc(100vh - 90px);
            min-height: 0;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 25px;
            height: 100%;
            min-height: 0;
        }

        /* --- CARDS & PANELS --- */
        .panel {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: border-color 0.3s;
        }

        .panel:hover {
            border-color: rgba(0, 242, 255, 0.4);
        }

        .panel-header {
            padding: 15px 25px;
            background: rgba(0, 242, 255, 0.05);
            border-bottom: 1px solid var(--border);
            font-family: 'Orbitron';
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--neon-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        /* --- TACTICAL UNITS --- */
        .unit-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-left: 5px solid var(--unit-color);
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .unit-card:hover {
            background: rgba(255,255,255,0.04);
            transform: translateX(5px);
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        .unit-name {
            font-family: 'Orbitron';
            font-size: 20px;
            font-weight: 900;
            color: var(--unit-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .metric-item {
            text-align: center;
        }

        .metric-item label {
            font-size: 9px;
            opacity: 0.4;
            display: block;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .metric-item value {
            font-family: 'Orbitron';
            font-size: 18px;
            font-weight: 700;
        }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-blue); }

        /* --- ANIMATIONS --- */
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(0, 242, 255, 0.1);
            z-index: 10000;
            pointer-events: none;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(100vh); }
        }

        .pnl-pos { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
        .pnl-neg { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }

        #clock-local { font-family: 'Orbitron'; font-size: 36px; font-weight: 900; color: var(--neon-blue); }

        /* --- TABS --- */
        .tab-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-item {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            cursor: pointer;
            font-family: 'Orbitron';
            font-size: 12px;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .tab-item.active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        .radar-box {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px dashed var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <header>
        <div class="title">SOVEREIGN NEXUS <span class="tag-status">HARDENED</span></div>
        <div class="pnl-container">
            <div class="pnl-box">
                <label>GLOBAL ASSETS // FRONT</label>
                <span id="usd-pnl" class="pnl-pos">$0.00</span>
                <div class="pnl-sub">
                    <span id="usd-week">W: +0.00</span>
                    <span id="usd-month">M: +0.00</span>
                </div>
            </div>
            <div class="pnl-box" style="border-left-color: var(--neon-purple)">
                <label>SOUTHERN COMMAND // BACK</label>
                <span id="vnd-pnl" class="pnl-pos">0 đ</span>
                <div class="pnl-sub">
                    <span id="vnd-week">W: +0</span>
                    <span id="vnd-month">M: +0</span>
                </div>
            </div>
            <div class="pnl-box" style="display: flex; flex-direction: column; justify-content: center; padding: 12px 20px; min-width: 220px;">
                <label>SYSTEM BALANCE (RUỘT vs VỎ)</label>
                <div class="ratio-bar-container" style="width: 100%;">
                    <div id="ratio-back" class="ratio-fill ratio-back" style="width: 70%"></div>
                    <div id="ratio-front" class="ratio-fill ratio-front" style="width: 30%"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 10px; margin-top: 8px; font-weight: 700; letter-spacing: 1px;">
                    <span id="ratio-back-text" style="color: var(--neon-purple)">BACK: 70%</span>
                    <span id="ratio-front-text" style="color: var(--neon-blue)">FRONT: 30%</span>
                </div>
            </div>
        </div>
        <div style="text-align: right">
            <div id="clock-local">00:00:00</div>
            <div style="font-size: 10px; opacity: 0.4; letter-spacing: 3px; font-weight: 700;">SYSTEM TIME // ICT SYNCED</div>
        </div>
    </header>

    <main>
        <!-- LEFT: TACTICAL ASSETS -->
        <div class="column">
            <div class="panel">
                <div class="panel-header">NEURAL RADAR // SCAN</div>
                <div class="panel-body" style="padding: 10px;">
                    <div class="tab-group">
                        <div class="tab-item active" onclick="flipPage('radar')">SCANNER</div>
                        <div class="tab-item" onclick="flipPage('pools')">POOLS</div>
                    </div>
                    <div id="page-radar" class="radar-box active" style="display: flex;">
                        <div id="scan-list-mini" class="scroll-area" style="padding: 15px;">
                            <!-- Active Scan Items -->
                        </div>
                    </div>
                    <div id="page-pools" class="radar-box" style="display: none; padding: 20px;">
                        <div class="metric-item" style="margin-bottom: 25px;">
                            <label>EXNESS EQUITY</label>
                            <value id="equity-mt5" style="color: var(--neon-blue); font-size: 32px;">$0.00</value>
                        </div>
                        <div class="metric-item" style="margin-bottom: 25px;">
                            <label>BINANCE EQUITY</label>
                            <value id="equity-bnc" style="color: var(--neon-gold); font-size: 32px;">$0.00</value>
                        </div>
                        <div class="metric-item">
                            <label>VN30 EQUITY</label>
                            <value id="equity-south" style="color: var(--neon-purple); font-size: 28px;">0 đ</value>
                        </div>
                    </div>
                </div>
            </div>
            <a href="southern_command.html" target="_blank" style="text-decoration:none; padding:15px; background:rgba(188,19,254,0.1); border:1px solid var(--neon-purple); color:var(--neon-purple); text-align:center; font-family:'Orbitron'; font-size:12px; font-weight:900; letter-spacing:3px; border-radius:4px;">ACCESS SOUTHERN COMMAND ></a>
        </div>

        <!-- CENTER: FLEET DEPLOYMENT -->
        <div class="column">
            <div class="panel" style="flex: 1;">
                <div class="panel-header">SOVEREIGN FLEET // DEPLOYMENT</div>
                <div id="squadron-list" class="panel-body">
                    <!-- Unit Cards Injected Here -->
                </div>
            </div>
        </div>

        <!-- RIGHT: ENGAGEMENT LOGS -->
        <div class="column">
            <div class="panel" style="flex: 1.5;">
                <div class="panel-header">LIVE ENGAGEMENT TRACKER</div>
                <div id="trade-log" class="panel-body" style="padding: 0;">
                    <!-- Engagement data -->
                </div>
            </div>
            <div class="panel" style="height: 250px;">
                <div class="panel-header">TACTICAL EVENT FEED</div>
                <div id="intel-list" class="panel-body" style="font-size: 11px; color: var(--neon-blue); opacity: 0.8;">
                    <!-- Learning events -->
                </div>
            </div>
        </div>
    </main>

    <!-- MODALS -->
    <div id="logic-modal" class="overlay-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); backdrop-filter:blur(20px); z-index:10000; padding:60px; border:2px solid var(--neon-blue);">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--neon-blue); padding-bottom:20px; margin-bottom:30px;">
            <div id="logic-modal-title" style="font-family:'Orbitron'; font-size:32px; font-weight:900; letter-spacing:5px;">UNIT PROTOCOL</div>
            <div style="font-size:40px; color:var(--neon-blue); cursor:pointer;" onclick="toggleLogic(null)">×</div>
        </div>
        <div id="logic-modal-body" style="color:#fff;"></div>
    </div>

    <script>
        const formatVND = (num) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num).replace('₫', 'đ');

        window.flipPage = function(target) {
            const p1 = document.getElementById('page-pools');
            const p2 = document.getElementById('page-radar');
            const tabs = document.querySelectorAll('.tab-item');
            
            if (target === 'radar') {
                p1.style.display = 'none';
                p2.style.display = 'flex';
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                p2.style.display = 'none';
                p1.style.display = 'block';
                tabs[1].classList.add('active');
                tabs[0].classList.remove('active');
            }
        };

        const SCAN_ASSETS = ["BTC", "ETH", "SOL", "XAU", "XAG", "NAS100", "US30", "EURUSD", "GBPUSD", "USDJPY", "AUDUSD", "DE30", "OIL", "GAS", "ADA", "DOT", "XRP", "LTC", "LINK", "AVAX", "XLM", "BNB", "MATIC", "FTM", "ATOM", "ALGO", "NEAR", "VET", "TRX", "HBAR"];
        
        function updateNeuralScan() {
            const miniList = document.getElementById('scan-list-mini');
            if (!miniList) return;

            const scanData = SCAN_ASSETS.map(asset => ({
                symbol: asset,
                er: (0.3 + Math.random() * 1.7).toFixed(2),
                id: Math.floor(Math.random() * 9999)
            })).sort((a, b) => b.er - a.er);

            miniList.innerHTML = scanData.slice(0, 15).map((data, index) => {
                const color = data.er > 1.2 ? 'var(--neon-green)' : 'var(--neon-blue)';
                return `
                    <div style="margin-bottom:12px; padding:10px; background:rgba(255,255,255,0.02); border-left:2px solid ${color}; display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-family:Orbitron; font-weight:700;">${data.symbol}</span>
                        <span style="color:${color}; font-weight:900;">ER: ${data.er}</span>
                    </div>
                `;
            }).join('');
        }
        setInterval(updateNeuralScan, 4000);

        const unitStyles = {
            "ALPHA": { 
                name: "GUARDIAN", icon: "🛡️", color: "var(--neon-blue)",
                desc: "Trend-Follower. High-conviction strikes.",
                diagram: "[PRICE] ───( ATR-CHANNEL )─── [ENTRY]\n          ▲                 ▼\n      ( VOL-CONF ) ──── ( TREND-LOCK )"
            },
            "OMEGA": { 
                name: "HARVESTER", icon: "⚔️", color: "var(--neon-gold)",
                desc: "Momentum Dominator. Aggressive ATR layering.",
                diagram: "[MOMENTUM] ──► [SCALE-IN] ──► [SCALE-MAX]\n     │            │             │\n     └─ ATR-ADJ ──┴─ RISK-PAR ──┘"
            },
            "GAMMA": { 
                name: "SCALPER", icon: "⚡", color: "var(--neon-purple)",
                desc: "Rapid Scalper. Mean-Reversion.",
                diagram: "[DEV] ── ( REVERSION ) ── [TARGET]\n  │            │            │\n  └─ BB-OUT ───┴─ RSI-DIV ──┘"
            }
        };

        window.toggleLogic = function(unit) {
            const modal = document.getElementById('logic-modal');
            if (!unit) { modal.style.display = 'none'; return; }
            
            const meta = unitStyles[unit];
            document.getElementById('logic-modal-title').innerText = `${unit} // TACTICAL PROTOCOL`;
            document.getElementById('logic-modal-title').style.color = meta.color;
            modal.style.borderColor = meta.color;
            
            document.getElementById('logic-modal-body').innerHTML = `
                <div style="font-size:24px; margin-bottom:30px; opacity:0.8">${meta.desc}</div>
                <div style="font-family:monospace; color:${meta.color}; font-size:18px; background:rgba(0,0,0,0.4); padding:30px; border:1px dashed ${meta.color}; white-space:pre; line-height:1.4;">${meta.diagram}</div>
            `;
            modal.style.display = 'block';
        };

        async function updateHUD() {
            try {
                const response = await fetch('http://127.0.0.1:5050/api/telemetry');
                const data = await response.json();

                if (data.status === "ONLINE") {
                    document.getElementById('clock-local').innerText = data.current_time_utc;
                    document.getElementById('usd-pnl').innerText = `$${(data.session_pnl_usd || 0).toFixed(2)}`;
                    document.getElementById('usd-pnl').className = data.session_pnl_usd >= 0 ? 'pnl-pos' : 'pnl-neg';
                    document.getElementById('usd-week').innerText = `W: ${(data.stats_week.usd >= 0 ? '+' : '')}${data.stats_week.usd.toFixed(2)}`;
                    document.getElementById('usd-month').innerText = `M: ${(data.stats_month.usd >= 0 ? '+' : '')}${data.stats_month.usd.toFixed(2)}`;

                    document.getElementById('vnd-pnl').innerText = formatVND(data.session_pnl_vnd || 0);
                    document.getElementById('vnd-pnl').className = data.session_pnl_vnd >= 0 ? 'pnl-pos' : 'pnl-neg';
                    document.getElementById('vnd-week').innerText = `W: ${(data.stats_week.vnd >= 0 ? '+' : '')}${Math.floor(data.stats_week.vnd/1000)}K`;
                    document.getElementById('vnd-month').innerText = `M: ${(data.stats_month.vnd >= 0 ? '+' : '')}${Math.floor(data.stats_month.vnd/1000)}K`;

                    const bRatio = data.system_balance.back;
                    const fRatio = data.system_balance.front;
                    document.getElementById('ratio-back').style.width = `${bRatio}%`;
                    document.getElementById('ratio-front').style.width = `${fRatio}%`;
                    document.getElementById('ratio-back-text').innerText = `BACK: ${bRatio.toFixed(1)}%`;
                    document.getElementById('ratio-front-text').innerText = `FRONT: ${fRatio.toFixed(1)}%`;

                    document.getElementById('equity-mt5').innerText = `$${(data.health_mt5.equity || 0).toFixed(2)}`;
                    document.getElementById('equity-bnc').innerText = `$${(data.health_bnc.equity || 0).toFixed(2)}`;
                    document.getElementById('equity-south').innerText = formatVND(data.health_south.equity_vnd || 0);

                    const squadDiv = document.getElementById('squadron-list');
                    if (!squadDiv) return;
                    squadDiv.innerHTML = '';

                    for (const [unit, symbols] of Object.entries(data.squadron)) {
                        const meta = unitStyles[unit] || { name: "RECON", icon: "🛰️", color: "var(--neon-blue)" };
                        const stats = data.unit_stats[unit] || { win_rate: "0%", context: { er: 0, confidence: 0 } };
                        
                        squadDiv.innerHTML += `
                            <div class="unit-card" style="--unit-color: ${meta.color}">
                                <div class="unit-name">${meta.icon} ${unit} <span style="font-size:10px; opacity:0.4; letter-spacing:2px; margin-left:auto;">${meta.name}</span></div>
                                <div class="metric-grid">
                                    <div class="metric-item"><label>ER</label><value>${stats.context.er.toFixed(2)}</value></div>
                                    <div class="metric-item"><label>WIN%</label><value style="color:var(--neon-green)">${stats.win_rate}</value></div>
                                    <div class="metric-item"><label>CONF</label><value>${stats.context.confidence}%</value></div>
                                </div>
                                <div style="margin-top:15px; display:flex; flex-wrap:wrap; gap:5px;">
                                    ${symbols.map(s => `<span style="font-size:10px; padding:2px 6px; background:rgba(255,255,255,0.05); border-radius:2px;">${s}</span>`).join('')}
                                </div>
                                <div style="margin-top:15px; border-top:1px solid rgba(255,255,255,0.05); padding-top:10px; display:flex; justify-content:space-between; align-items:center;">
                                    <span style="font-size:11px; opacity:0.5">LOT: ${data.dna[unit]?.LOT_SIZE || 'AUTO'}</span>
                                    <span style="font-size:10px; color:${meta.color}; cursor:pointer; font-weight:700;" onclick="toggleLogic('${unit}')">STRATEGY ></span>
                                </div>
                            </div>
                        `;
                    }

                    const tradeDiv = document.getElementById('trade-log');
                    if (tradeDiv) {
                        tradeDiv.innerHTML = data.trades.slice(0, 10).map(t => `
                            <div style="padding:15px; border-bottom:1px solid rgba(255,255,255,0.03); display:flex; justify-content:space-between;">
                                <div>
                                    <div style="font-weight:700; font-family:Orbitron;">${t.symbol}</div>
                                    <div style="font-size:10px; opacity:0.4;">${t.unit} // ${t.side}</div>
                                </div>
                                <div style="text-align:right;">
                                    <div class="${t.pnl >= 0 ? 'pnl-pos' : 'pnl-neg'}" style="font-size:18px; font-weight:900;">$${t.pnl.toFixed(2)}</div>
                                    <div style="font-size:10px; opacity:0.3;">${t.time.split(' ')[1] || t.time}</div>
                                </div>
                            </div>
                        `).join('');
                    }
                }
            } catch (e) { console.error("HUD Error:", e); }
        }

        async function updateIntelligence() {
            try {
                const response = await fetch('http://127.0.0.1:5050/api/intelligence');
                const data = await response.json();
                const intelList = document.getElementById('intel-list');
                if (data.top_configs && intelList) {
                    intelList.innerHTML = data.top_configs.slice(0, 5).map(c => `
                        <div style="margin-bottom:8px; display:flex; justify-content:space-between;">
                            <span>${c.symbol} (SL:${c.sl} TP:${c.tp})</span>
                            <span style="color:var(--neon-green)">+${(c.avg_pnl || 0).toFixed(2)}</span>
                        </div>
                    `).join('');
                }
            } catch (e) {}
        }

        setInterval(updateHUD, 3000);
        setInterval(updateIntelligence, 10000);
        updateHUD();
        updateNeuralScan();
    </script>
</body>
</html>
