<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN // DAILY TACTICAL REPORT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-gold: #ffcc00;
            --neon-purple: #bc13fe;
            --neon-green: #00ff88;
            --neon-red: #ff004c;
            --bg: #030712;
            --glass: rgba(15, 23, 42, 0.9);
        }

        body {
            background: var(--bg);
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 40px;
            overflow-x: hidden;
        }

        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(0, 242, 255, 0.03);
            z-index: 1000;
            pointer-events: none;
            animation: scanline 10s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .title-group h1 {
            font-family: 'Orbitron';
            font-size: 28px;
            letter-spacing: 5px;
            margin: 0;
            color: var(--neon-blue);
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        }

        .report-meta {
            font-size: 12px;
            opacity: 0.5;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .metric-card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-blue);
            box-shadow: 0 10px 30px rgba(0, 242, 255, 0.1);
        }

        .metric-label {
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.4;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .metric-value {
            font-family: 'Orbitron';
            font-size: 24px;
            font-weight: 700;
        }

        .grid-main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .panel {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 30px;
        }

        .panel-header {
            font-family: 'Orbitron';
            font-size: 12px;
            letter-spacing: 3px;
            opacity: 0.3;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
        }

        .trade-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 14px;
            transition: background 0.3s;
        }

        .trade-row:hover { background: rgba(255, 255, 255, 0.02); }

        .back-btn {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 10px 25px;
            font-family: 'Orbitron';
            font-size: 10px;
            text-decoration: none;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: var(--neon-blue);
            color: var(--bg);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .tab-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab {
            padding: 8px 20px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
            opacity: 0.5;
        }

        .tab.active {
            opacity: 1;
            border-color: var(--neon-blue);
            background: rgba(0, 242, 255, 0.1);
        }

        .locked {
            opacity: 0.2 !important;
            cursor: not-allowed !important;
            position: relative;
        }

        .locked::after {
            content: 'LOCKED';
            position: absolute;
            top: -10px; right: -10px;
            font-size: 8px;
            background: var(--neon-red);
            padding: 2px 5px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="scanline"></div>

    <header>
        <div class="title-group">
            <h1>TACTICAL PERFORMANCE REPORT</h1>
            <div class="report-meta">SOVEREIGN INTELLIGENCE LOOP // SESSION: <span id="current-date">--</span></div>
        </div>
        <a href="http://127.0.0.1:5050/" class="back-btn">< BACK TO NEXUS</a>
    </header>

    <div class="tab-group">
        <div class="tab active">DAILY</div>
        <div class="tab locked">WEEKLY</div>
        <div class="tab locked">MONTHLY</div>
    </div>

    <div class="summary-grid">
        <div class="metric-card">
            <div class="metric-label">Total Realized PnL</div>
            <div id="total-pnl" class="metric-value">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Win Rate (Session)</div>
            <div id="win-rate" class="metric-value">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Total Strikes</div>
            <div id="total-strikes" class="metric-value">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Alpha Efficiency</div>
            <div id="avg-er" class="metric-value">--</div>
        </div>
    </div>

    <div class="panel" style="margin-bottom: 40px; height: 300px;">
        <div class="panel-header">EQUITY GROWTH CURVE <span>REAL-TIME PERFORMANCE</span></div>
        <canvas id="equityChart"></canvas>
    </div>

    <div class="grid-main">
        <div class="panel">
            <div class="panel-header">SESSION STRIKE LOG <span>DETAILED EXECUTION</span></div>
            <div id="strike-log">
                <!-- Data -->
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">TOP PERFORMERS <span>UNIT BIAS</span></div>
            <div id="top-performers">
                <!-- Data -->
            </div>
        </div>
    </div>

    <script>
        async function loadReport() {
            try {
                const response = await fetch('http://127.0.0.1:5050/api/telemetry');
                const data = await response.json();
                
                document.getElementById('current-date').innerText = new Date().toLocaleDateString();
                
                // Today's summary
                const pnlUsd = data.session_pnl_usd || 0;
                const pnlVnd = data.session_pnl_vnd || 0;
                
                document.getElementById('total-pnl').innerText = `$${pnlUsd.toFixed(2)} / ${pnlVnd.toLocaleString()} đ`;
                document.getElementById('total-pnl').style.color = pnlUsd >= 0 ? 'var(--neon-green)' : 'var(--neon-red)';
                
                // Aggregate Stats
                let totalStrikes = 0;
                let wins = 0;
                for(const unit of Object.values(data.unit_stats)) {
                    totalStrikes += unit.strikes;
                    if(unit.win_rate) wins += (parseInt(unit.win_rate) / 100) * unit.strikes;
                }
                
                const wr = totalStrikes > 0 ? (wins / totalStrikes * 100).toFixed(0) : 0;
                document.getElementById('win-rate').innerText = wr + '%';
                document.getElementById('total-strikes').innerText = totalStrikes;
                document.getElementById('avg-er').innerText = '0.52'; // Placeholder for avg ER

                // Strike Log
                const logDiv = document.getElementById('strike-log');
                logDiv.innerHTML = data.trades.map(t => `
                    <div class="trade-row">
                        <div style="font-family:'Orbitron'; color:var(--neon-blue)">${t.symbol}</div>
                        <div style="text-align:center; color:${t.side==='BUY' || t.side==='LONG' ? 'var(--neon-green)' : 'var(--neon-red)'}">${t.side}</div>
                        <div style="text-align:center; font-weight:700; color:${t.pnl >= 0 ? 'var(--neon-green)' : 'var(--neon-red)'}">${t.pnl > 0 ? '+' : ''}${t.pnl.toFixed(2)}</div>
                        <div style="text-align:right; opacity:0.5">${t.unit}</div>
                    </div>
                `).join('');

            } catch (e) {
                console.error("Report Load Error:", e);
            }
        }

        async function initChart() {
            try {
                const response = await fetch('http://127.0.0.1:5050/api/reports/equity_curve');
                const data = await response.json();
                
                const ctx = document.getElementById('equityChart').getContext('2d');
                const gradient = ctx.createLinearGradient(0, 0, 0, 300);
                gradient.addColorStop(0, 'rgba(0, 242, 255, 0.2)');
                gradient.addColorStop(1, 'rgba(0, 242, 255, 0)');

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.map(d => d.t.split(' ')[1]),
                        datasets: [{
                            label: 'Equity (USD)',
                            data: data.map(d => d.e),
                            borderColor: '#00f2ff',
                            backgroundColor: gradient,
                            fill: true,
                            tension: 0.4,
                            borderWidth: 2,
                            pointRadius: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { display: false },
                            y: { 
                                grid: { color: 'rgba(255,255,255,0.05)' },
                                ticks: { color: 'rgba(255,255,255,0.3)', font: { size: 10 } }
                            }
                        }
                    }
                });
            } catch (e) { console.error("Chart Error:", e); }
        }

        loadReport();
        initChart();
    </script>
</body>
</html>
