<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN // ELITE STRIKE TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-gold: #ffcc00;
            --neon-green: #00ff88;
            --neon-red: #ff004c;
            --bg: #010204;
            --glass: rgba(10, 15, 25, 0.95);
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px 40px;
            background: rgba(0, 242, 255, 0.05);
            border-bottom: 2px solid var(--neon-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .terminal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            letter-spacing: 12px;
            color: var(--neon-blue);
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.6);
        }

        .real-money-stats {
            display: flex;
            gap: 40px;
        }

        .stat-box {
            text-align: right;
        }

        .stat-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            opacity: 0.5;
            letter-spacing: 2px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            padding: 30px;
            flex-grow: 1;
        }

        .unit-card {
            background: var(--glass);
            border: 1px solid rgba(0, 242, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.3s ease;
        }

        .unit-card.active {
            border-color: var(--neon-blue);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.1);
        }

        .unit-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .unit-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 5px;
            color: rgba(255,255,255,0.4);
        }

        .unit-status {
            font-size: 10px;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-family: 'Orbitron', sans-serif;
        }

        .asset-focus {
            font-size: 52px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 5px;
            color: var(--neon-blue);
        }

        .regime-badge {
            font-size: 12px;
            opacity: 0.6;
            letter-spacing: 3px;
        }

        .strike-parameters {
            margin-top: auto;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 20px;
        }

        .param-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .param-label {
            font-size: 12px;
            opacity: 0.4;
            font-family: 'Orbitron', sans-serif;
        }

        .param-value {
            font-size: 18px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
        }

        .signal-radar {
            height: 150px;
            background: rgba(0,0,0,0.8);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding: 20px 40px;
            display: flex;
            flex-direction: column;
        }

        .radar-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 5px;
            opacity: 0.5;
            margin-bottom: 15px;
        }

        .signal-feed {
            display: flex;
            gap: 20px;
            overflow-x: auto;
        }

        .signal-item {
            min-width: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--neon-gold);
            padding: 15px;
            border-radius: 4px;
        }

        .signal-header {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            opacity: 0.5;
            margin-bottom: 8px;
        }

        .signal-main {
            font-weight: 700;
            font-size: 16px;
            color: var(--neon-gold);
        }

        .copy-button {
            position: absolute;
            top: 25px;
            right: 25px;
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 8px 15px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 10px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
        }

        .shimmer {
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <div class="terminal-title">ELITE STRIKE TERMINAL</div>
        <div class="real-money-stats">
            <div class="stat-box">
                <div class="stat-label">REAL EQUITY ($100)</div>
                <div id="real-equity" class="stat-value" style="color:var(--neon-gold)">$100.00</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">SESSION PROFIT</div>
                <div id="real-pnl" class="stat-value" style="color:var(--neon-green)">+$0.00</div>
            </div>
        </div>
    </header>

    <main id="unit-grid">
        <!-- Units populated by JS -->
    </main>

    <div class="signal-radar">
        <div class="radar-title">SOVEREIGN SIGNAL RADAR // TELEGRAM RELAY ACTIVE</div>
        <div id="signal-feed" class="signal-feed">
            <!-- Signals populated by JS -->
        </div>
    </div>

    <script>
        async function updateTerminal() {
            try {
                const response = await fetch('http://127.0.0.1:5050/api/telemetry');
                const data = await response.json();

                // Update Header
                document.getElementById('real-pnl').innerText = `+$${data.session_pnl_usd.toFixed(2)}`;
                document.getElementById('real-pnl').style.color = data.session_pnl_usd >= 0 ? 'var(--neon-green)' : 'var(--neon-red)';

                // Update Grid (ENGAGE ONLY MODE)
                const grid = document.getElementById('unit-grid');
                grid.innerHTML = '';

                const eliteUnits = ['ALPHA', 'OMEGA', 'GAMMA'];
                let engagedCount = 0;

                eliteUnits.forEach(unit => {
                    const dna = data.dna[unit] || {};
                    const squad = data.squadron[unit] || ['SCANNERS_IDLE'];
                    const stats = data.unit_stats[unit] || {win_rate: '0%', strikes: 0};
                    const unitColor = unit === 'ALPHA' ? 'var(--neon-blue)' : unit === 'OMEGA' ? 'var(--neon-gold)' : '#bc13fe';

                    // ENGAGE FILTER: Only show if unit is in an active trade or has a fresh signal
                    const isActive = squad[0] !== 'SCANNERS_IDLE';
                    
                    if (isActive) {
                        engagedCount++;
                        const card = document.createElement('div');
                        card.className = `unit-card active shimmer`;
                        card.style.borderColor = unitColor;

                        card.innerHTML = `
                            <div class="unit-header">
                                <div>
                                    <div class="unit-name">${unit} UNIT</div>
                                    <div class="regime-badge" style="color:${unitColor}">ENGAGED // WR: ${stats.win_rate}</div>
                                </div>
                                <div class="unit-status" style="background:var(--neon-red); border:none; color:#000">STRIKE</div>
                            </div>
                            <div class="asset-focus">${squad[0].replace('USDT','')}</div>
                            <div class="regime-badge">REGIME: ${data.dna.GLOBAL ? data.dna.GLOBAL.REGIME : 'ACTIVE'}</div>
                            
                            <div class="strike-parameters">
                                <div style="font-size:10px; opacity:0.3; margin-bottom:15px; font-family:'Orbitron'">COPY TO REAL ACCOUNT ($100)</div>
                                <div class="param-row">
                                    <span class="param-label">ACTION</span>
                                    <span class="param-value" style="color:var(--neon-green)">EXECUTE NOW</span>
                                </div>
                                <div class="param-row">
                                    <span class="param-label">ENTRY PRICE</span>
                                    <span class="param-value" style="color:var(--neon-blue)">${dna.LAST_ENTRY || '---'}</span>
                                </div>
                                <div class="param-row">
                                    <span class="param-label">RECOMMENDED LOT</span>
                                    <span class="param-value" style="color:var(--neon-gold)">0.01</span>
                                </div>
                                <div class="param-row">
                                    <span class="param-label">SL MULTIPLIER</span>
                                    <span class="param-value">${dna.SL || '1.5'}x</span>
                                </div>
                                <div class="param-row">
                                    <span class="param-label">TP MULTIPLIER</span>
                                    <span class="param-value">${dna.TP || '3.0'}x</span>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    }
                });

                if (engagedCount === 0) {
                    grid.innerHTML = `
                        <div style="grid-column: 1 / span 3; text-align:center; padding:100px; opacity:0.2">
                            <div style="font-family:'Orbitron'; font-size:24px; letter-spacing:10px">NO ACTIVE STRIKES</div>
                            <div style="font-size:12px; margin-top:20px">AI SCOUTS ARE SCANNING THE VIETNAM PERIMETER...</div>
                        </div>
                    `;
                }

                // Update Signals (VN TIME)
                const feed = document.getElementById('signal-feed');
                feed.innerHTML = '';
                data.trades.slice(0, 5).forEach(t => {
                    if (t.unit && eliteUnits.includes(t.unit.split('_')[0])) {
                        const vnTime = new Date(t.time.replace(' ', 'T')).toLocaleString('en-GB', { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        const div = document.createElement('div');
                        div.className = 'signal-item';
                        div.style.borderLeftColor = t.pnl >= 0 ? 'var(--neon-green)' : 'var(--neon-red)';
                        div.innerHTML = `
                            <div class="signal-header">
                                <span>${t.unit} // STRIKE</span>
                                <span>${vnTime}</span>
                            </div>
                            <div class="signal-main">${t.side} ${t.symbol.replace('USDT','')} @ ${t.price.toFixed(2)}</div>
                            <div style="font-size:10px; margin-top:5px; opacity:0.6">🎯 TP: ${t.tp.toFixed(2)} | 🛑 SL: ${t.sl.toFixed(2)}</div>
                        `;
                        feed.appendChild(div);
                    }
                });

            } catch (e) { console.error(e); }
        }

        setInterval(updateTerminal, 3000);
        updateTerminal();
    </script>
</body>
</html>
